[package]
name = "skill-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml-rust2 = "0.8"
rfd = "0.15"
dirs = "5.0"
walkdir = "2.5"
regex = "1.10"
tempfile = "3.10"
thiserror = "1.0"
tokio = { version = "1.38", features = ["rt", "rt-multi-thread"] }

