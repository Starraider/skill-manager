name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-bundle:
    name: Build (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target-name: macOS (Apple Silicon - aarch64)
            arch: macos-aarch64
            target: aarch64-apple-darwin
          - os: macos-latest
            target-name: macOS (Intel - x86_64)
            arch: macos-x86_64
            target: x86_64-apple-darwin
          - os: windows-latest
            target-name: Windows (x86_64)
            arch: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target-name: Linux (x86_64)
            arch: linux-x86_64
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libssl-dev \
            build-essential

      - name: Install Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli

      - name: Run Tests (native host only)
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test

      - name: Bundle Desktop Application
        run: dx bundle --release --platform desktop --target ${{ matrix.target }}

      # Prepare artifacts on macOS & Linux
      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist

          # Copy installer packages (.dmg, .deb, .AppImage) if produced
          find target -name "*.dmg" -exec cp {} "dist/SkillManager-${{ matrix.arch }}.dmg" \; 2>/dev/null || true
          find target -name "*.deb" -exec cp {} "dist/SkillManager-${{ matrix.arch }}.deb" \; 2>/dev/null || true
          find target -name "*.AppImage" -exec cp {} "dist/SkillManager-${{ matrix.arch }}.AppImage" \; 2>/dev/null || true

          # macOS: create .zip of the .app bundle
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP_PATH=$(find target -name "SkillManager.app" -type d | head -n 1)
            if [ -n "$APP_PATH" ]; then
              ditto -c -k --keepParent "$APP_PATH" "dist/SkillManager-${{ matrix.arch }}.zip"
            fi
          fi

          # Linux: create .tar.gz archive of the compiled release binary
          if [ "${{ runner.os }}" = "Linux" ]; then
            BIN_PATH=$(find target -type f -name "skill-manager" -perm -111 ! -name "*.so" ! -name "*.d" | grep -E "(release/skill-manager|bundle/.*skill-manager)" | head -n 1)
            if [ -n "$BIN_PATH" ]; then
              tar -czvf "dist/SkillManager-${{ matrix.arch }}.tar.gz" -C "$(dirname "$BIN_PATH")" "$(basename "$BIN_PATH")"
            fi
          fi

      # Prepare artifacts on Windows
      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # Copy MSI installer if produced
          Get-ChildItem -Path target -Recurse -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist/SkillManager-${{ matrix.arch }}.msi"
          }

          # Create .zip archive of the standalone executable
          $bin = Get-ChildItem -Path target -Recurse -Filter skill-manager.exe | Where-Object { $_.FullName -like "*release*skill-manager.exe" } | Select-Object -First 1
          if ($bin) {
            Compress-Archive -Path $bin.FullName -DestinationPath "dist/SkillManager-${{ matrix.arch }}.zip" -Force
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-bundle
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: artifacts-*
          merge-multiple: true

      - name: List collected release assets
        run: ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

